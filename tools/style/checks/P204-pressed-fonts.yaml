    - {fixture: fallback-font, why: "DejaVuSans, a fallback for a glyph Junicode lacks"}
  pass:
    - {fixture: pressed-font-names, why: "JunicodePressed, Pressed-20, pressedchant, TeXGyrePagella, LMMono"}
