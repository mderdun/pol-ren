id: U209
name: cluster-short
level: look
weight: 1.5
tier: idiom
principle: "10.6"
authority: "Miki, review of 4 Oct 2026 (Cantus 34.2, alternative 1: moving so- back 'means that the mouth has to move between o-n-s across a quaver'); second review of 4 Oct 2026, for Polish: 'we can't \"solve\" polish clusters - we can remove them in particularly tricky spots like short note changes'. No period theorist is cited for it; the 10.1 limits on short notes (Stoquerus, Rotola ed., 227, 243) are the nearest rule."
message: "'{txt}' to '{nxt}' passes {n} consonants on a {value}"
# Polish clusters weigh pl_factor times as much, and a Polish cluster of
# pl_cluster consonants or more also counts (amount pl_short) at a change
# after the shortest value that may take a syllable (a minim under cut-C).
params: {pl_factor: 2.0, pl_cluster: 3, pl_short: 0.5}
examples:
  flag:
    - {notes: "f3 e1 d1/2 c1/2 d2 e2", text: "con- _ _ _ so- la", at: 0, why: "Cantus 34.2, alternative 1: o-n-s across the last fusa of the run"}
    - {notes: "f3 e1 d1/2 c1/2 d2 e2", text: "wszy- _ _ _ stkie _", lang: pl, at: 0, why: "Polish s-t-k across a fusa, at twice the weight"}
    - {notes: "f2 g2 a4", text: "wszy- stkich _", lang: pl, at: 0, why: "a Polish cluster of three at a change after a minim, the shortest syllable value under cut-C"}
  pass:
    - {notes: "f3 e1 d1/2 c1/2 d2 e2", text: "con- _ _ _ _ so", why: "the change comes after a minim"}
    - {notes: "f3 e1 d1/2 c1/2 d2 e2", text: "Ra- _ _ _ ma _", why: "one consonant only (a-m-a)"}
    - {notes: "f2 g2 a4", text: "con- stan- tes", why: "in Latin a change after a minim is not short"}
    - {notes: "f2 g2 a4", text: "noc- ka _", lang: pl, why: "two consonants after a minim: not a Polish tricky spot"}
