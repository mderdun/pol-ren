        Cantus: {notes: "g4 b4 c'4 d'4", text: "Do- _ mi- nus."}
        Tenor:  {notes: "e4 d4 c8", text: "Do- mi- nus."}
      rule_voice: Cantus
      why: "the arrival carries -mi-; the phrase's last syllable comes after it"
