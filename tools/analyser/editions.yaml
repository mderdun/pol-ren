# Per-edition settings the analyser cannot read from the MusicXML.
#
# mensuration: the sign the rules should assume (principles 5.4, 10.1).
#   cut  ¢: a new syllable needs a minim or longer (10.1)
#   C    C: semiminims count as minims (10.1; Stoquerus, Rotola ed., 227, 243)
#   The MusicXML carries the printed sign; this entry wins where the edition
#   prints none.
# waclaw_practice: apply 10.7 (one melisma before each cadence, on the stressed
#   syllable of the last word).
# older_practice: a piece before the mid-sixteenth-century accent rules; the
#   stress and light-word rules count for half (gates.yaml: older_practice).
# key_words: words carrying the sense of each clause, for 10.6 ("the stressed
#   syllable or the key word takes the long note or the high point"; lexicon
#   class "key"). Each entry is {word, source}. Entries whose source begins
#   "proposed" are the analyser's proposals from the text (4 October 2026),
#   shown in the review page and `analyse --layers` but with NO effect until
#   the editor confirms them: change the source to "MD, <date>" (or delete the
#   entry). A confirmed key word is no longer light (U201, U205) and its
#   stressed syllable weighs more when short (gates.yaml: key_word).
# strophic: the piece has stanzas under the same notes (10.14, rule U305).
# text_edits: false to offer no dropped or repeated words (10.13) here.

nunc-scio-vere:
  lang: la
  mensuration: cut
  mensuration_note: "editorial sign; the source is a tablature (critical edition, Note values)"
  waclaw_practice: true
  key_words:
